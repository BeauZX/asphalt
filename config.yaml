# 路面劣化分級 — 參數設定
# 這裡只放「跑起來用什麼參數」。「這次怎麼跑」是由命令列決定：
#
#   python3 asphalt_main.py --live --ui   相機，重新框選路面範圍
#   python3 asphalt_main.py --live        相機，沿用上次框的範圍（不開視窗）
#   python3 asphalt_main.py --ui          影片檔，重新框選
#   python3 asphalt_main.py               影片檔，沿用上次框的範圍
#   加 --no-save 則只顯示不存檔
#
# 框選的範圍會存進 roi.json，所以只要框過一次，之後都不用再框。
# 改完這個檔存檔後重新執行即生效。

# ── 路徑 ────────────────────────────────────────────
# 一律用正斜線：樹莓派是 Linux，反斜線不是路徑分隔符
# 副檔名決定用哪個推論後端：
#   .hef → Hailo-8 AI HAT（3×5 格約 30 ms）
#   .pt  → CPU 上跑 YOLO（3×5 格約 600 ms，沒插 HAT 時的備援）
model: model/asphalt_cls.hef
# model: model/asphalt_prep_v2_best.pt
video: videos/asphalt/asphalt.MP4     # 只有不加 --live 時會用到
output_dir: output_videos

# ── 分段存檔 ────────────────────────────────────────
# 影片依序存成 001.mp4、002.mp4…；重複執行會從現有的最大編號往後接，不覆蓋舊檔
segment_seconds: 60

# ── 網格分析 ────────────────────────────────────────
grid:
  rows: 3           # 格子列數
  cols: 5           # 格子欄數
                    # Hailo：3×5=15 格約 30 ms，格數已不是瓶頸，可以放心加大。
                    # CPU（.pt）：瓶頸是「格數」不是解析度，4×10=40 格每次要 1.2 秒，
                    # 3×5=15 格 0.6 秒，格數砍半、時間就砍半。
  imgsz: 128        # 推論解析度，只對 .pt 有效（模型訓練時是 256）；
                    # .hef 的輸入尺寸編譯時已固定為 256，這個值會被忽略。
                    # CPU 上 40 格時 256→128 幾乎沒差（卡在每格的固定開銷），
                    # 但格數少之後降 imgsz 就有效，128 是速度與準確度的折衷
  ema_alpha: 0.45   # 時序平滑係數 (0~1)，越小越平滑、反應越慢
  switch_margin: 0.1  # 切換類別所需的機率優勢，避免在邊界反覆跳動

# ── 相機（加 --live 時使用）────────────────────────
camera:
  id: 0             # 用哪顆鏡頭
  width: 1280
  height: 720
  fps: 25           # 實測值：Pi 5 上 720p 邊錄邊分析大約就是這個上限
  # 曝光沿用 imx_video/rpi5_dual_camera_capture.py 實測過的組合：
  # 不指定固定快門/增益，交給鏡頭自己的 AEC/AGC 依現場光線即時調整
  exposure: normal  # sport  = 短曝光大增益，減少動態模糊，暗處噪點多
                    #          （車速快、路面紋理被拖糊時改這個）
                    # normal = 預設
                    # long   = 長曝光，暗處乾淨但容易動態模糊，不適合快速移動
  awb: auto         # 固定色溫預設會放大感光元件本身的色彩差異，auto 實測反而更準
  torch_threads: 2  # 只對 .pt 有效：限制 YOLO 用幾顆核心，留 CPU 給讀取與編碼，避免畫面卡頓

# ── 框選視窗 ────────────────────────────────────────
window:
  roi_max_w: 1600   # 框選視窗的最大寬度，超過就等比例縮小顯示
  roi_max_h: 900    # 影片解析度常比螢幕大（例如 2704×1520 的影片配 2560×1440 的螢幕），
                    # 原尺寸顯示會超出畫面、拖不到邊角
