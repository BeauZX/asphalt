[project]
name = "pothole"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# 3.13 是因為 Hailo 的 Python binding（apt 的 python3-hailort）只有系統 Python 3.13 的版本
requires-python = ">=3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
# 一定要用系統的 /usr/bin/python3.13，不能讓 uv 自己下載一份：
# venv 要靠 --system-site-packages 借用系統的 hailo_platform，
# uv 下載的 Python 看不到系統的 dist-packages
python-preference = "only-system"
